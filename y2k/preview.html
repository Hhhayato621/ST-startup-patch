<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f8edef">
<title>粉色翻盖手机 · 载入动画预览</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center;
  background: #f8edef url("/img/y2k-phone-startup/background.jpg") center / cover no-repeat;
  isolation: isolate;
  color: #84204e; font-family: system-ui, sans-serif;
}
body::before {
  content: ""; position: fixed; inset: 0;
  z-index: -1; pointer-events: none;
  background: radial-gradient(ellipse at 10% -15%, #fffc, transparent 57%),
              radial-gradient(ellipse at 105% 105%, #fff7, transparent 55%),
              linear-gradient(135deg, #fff4, transparent 39%, #fff1 68%, #fff5);
  backdrop-filter: blur(.55px) saturate(1.04) brightness(1.025);
  -webkit-backdrop-filter: blur(.55px) saturate(1.04) brightness(1.025);
}
main { width: min(100%, 640px); padding: 12px 12px 20px; text-align: center; }
.stage { position: relative; aspect-ratio: 1.13; container-type: inline-size; isolation: isolate; }
.phone {
  position: absolute; width: 72%; height: auto; left: 7%; top: 7%; z-index: 1;
  transform-origin: 48% 77%; filter: drop-shadow(0 12px 12px #af498643);
}
.screen-beat, .charm { transform-box: view-box; }
.screen-beat { transform-origin: 52.4% 29%; }
.charm { transform-origin: 36% 50%; }
.signal { opacity: 0; }
.receive-status {
  position: absolute; left: 43%; bottom: 3%; transform: translateX(-50%);
  color: #864466; font: 650 clamp(10px, 2.6cqw, 15px)/1.2 ui-monospace, monospace !important;
  letter-spacing: .12em; white-space: nowrap; text-shadow: 0 1px #fff;
}
.receive-status span { display: inline-block; }
.sms {
  position: absolute; z-index: 3; left: 55%; top: 24%; width: 37cqw;
  padding: .75cqw; border: 1px solid #b96a9c; border-radius: 2.8cqw;
  background: linear-gradient(165deg,#fffcff 0%,#eeb3db 52%,#c985b8 100%);
  box-shadow: inset 0 1px 0 #fff, 0 2px 0 #a8609380, 0 8px 20px #78365e35;
  transform-origin: 5% 80%; text-align: left;
}
.sms::before {
  content: ""; position: absolute; width: 3.1cqw; height: 3.1cqw; left: -1.65cqw; top: 61%;
  background: #e5a8d2; border-left: 1px solid #b96a9c; border-bottom: 1px solid #b96a9c;
  transform: rotate(45deg); border-bottom-left-radius: .5cqw;
}
.sms, .sms * { font-family: system-ui, sans-serif !important; }
.sms-screen {
  position: relative; overflow: hidden; border: 1px solid #c582b1; border-radius: 2cqw;
  background: #fff5fc;
}
.sms-header {
  display: flex; align-items: center; gap: 1.15cqw; padding: 1.15cqw 1.7cqw;
  background: linear-gradient(#fff8ff,#f3d7ee 51%,#ebc6e5 52%,#f1d0e9);
  border-bottom: 1px solid #d7a5ca; color: #653759;
  font: 700 clamp(9px, 2.15cqw, 13px)/1.25 system-ui,sans-serif;
  white-space: nowrap;
}
.sms-header svg { width: 2.8cqw; min-width: 10px; height: auto; }
.sms-header time { margin-left: auto; font-weight: 550; font-variant-numeric: tabular-nums; }
.sms strong {
  display: block; padding: 2.2cqw 2.8cqw 2.75cqw; color: #632047;
  background: repeating-linear-gradient(0deg,#8c337705 0 1px,transparent 1px 3px),
              linear-gradient(150deg,#fffafd,#f9e1f2);
  font-size: 5.5cqw; line-height: 1.35; font-weight: 700; letter-spacing: .065em;
  text-shadow: 0 1px #fff; white-space: nowrap;
}
.typing-line { display: inline-flex; align-items: center; }
.letter { display: block; overflow: hidden; }
.cursor {
  display: inline-block; width: .085em; height: .84em; margin-left: .15em;
  background: #8e3566; opacity: 0;
}
.bubble::after {
  content: ""; position: absolute; inset: 5%; border-radius: 50%; opacity: 0;
  background: radial-gradient(circle at 28% 25%, #fffe, transparent 33%);
}
.particle {
  position: absolute; left: var(--left); top: var(--top); width: var(--size); aspect-ratio: 1;
  pointer-events: none; transform: rotate(var(--tilt,0deg)); z-index: 2;
}
.heart { filter: drop-shadow(0 2px 4px #c8459355); }
.bubble {
  border-radius: 50%; border: 1px solid #fffc;
  background: radial-gradient(circle at 30% 26%,#fff 1%,#fff9 9%,transparent 24%), radial-gradient(circle at 38% 38%,#fff1 29%,#fbc9eb50 58%,#db9ceb8c 79%,#fff9 100%);
  box-shadow: inset 0 0 8px #fff9,0 2px 8px #d48bd340;
}
.stage:not(.playing) :is(.sms,.particle) { opacity: 0; }
.playing .phone { animation: ring 1200ms ease-in-out 330ms both; }
.playing .sms { animation: pop 620ms cubic-bezier(.16,.78,.28,1) 1680ms both; }
.playing .particle { animation: float-in 1500ms cubic-bezier(.12,.7,.22,1) var(--delay) both,
    drift calc(4100ms + var(--delay)) ease-in-out calc(var(--delay) + 1500ms) infinite; }
.playing .bubble::after { animation: gleam calc(4700ms + var(--delay)) ease-in-out calc(var(--delay) + 1300ms) infinite; }
.playing .screen-beat { animation: heartbeat 2600ms ease-in-out 3500ms infinite; }
.playing .charm { animation: sway 4600ms ease-in-out 1550ms infinite; }
.playing .signal { animation: gleam 3300ms ease-in-out 1800ms infinite; }
.playing .letter { animation: reveal 100ms steps(1,end) calc(2200ms + var(--letter-index) * 195ms) backwards; }
.playing .cursor { animation: blink 2220ms step-end 1950ms both; }
.playing .receive-status span { animation: dots 1500ms steps(1,end) calc(var(--dot-index) * 210ms) infinite both; }
@keyframes reveal {
  from { max-inline-size: 0; opacity: 0; }
  to { max-inline-size: 1.2em; opacity: 1; }
}
@keyframes blink {
  0%, 63%, 87% { opacity: 1; }
  51%, 75%, 100% { opacity: 0; }
}
@keyframes dots { 0%, 72% { opacity: .2; } 21%, 71% { opacity: 1; } }
@keyframes sway { 0%, 50%, 100% { transform: rotate(0); } 25% { transform: rotate(1.9deg); } 75% { transform: rotate(-1.9deg); } }
@keyframes heartbeat { 0%, 14%, 30%, 100% { transform: none; } 7% { transform: scale(1.12); } 22% { transform: scale(1.07); } }
@keyframes gleam { 0%, 10%, 31%, 100% { opacity: 0; } 19% { opacity: .88; } }
@keyframes drift { 0%, 100% { translate: 0 0; } 50% { translate: 0 -1cqw; } }
@keyframes ring {
  0%,100% { transform: none; }
  11% { transform: translateX(-2.2%) rotate(-7deg); }
  23% { transform: translateX(2.2%) rotate(7deg); }
  35% { transform: translateX(-2%) rotate(-6deg); }
  47% { transform: translateX(1.8%) rotate(5deg); }
  59% { transform: translateX(-1.5%) rotate(-4.5deg); }
  71% { transform: translateX(1.25%) rotate(3.5deg); }
  82% { transform: translateX(-.8%) rotate(-2.5deg); }
  91% { transform: translateX(.4%) rotate(1deg); }
}
@keyframes pop {
  0% { opacity: 0; transform: translate(-20%,20%) scale(.38); }
  67% { opacity: 1; transform: scale(1.075); }
  84% { transform: scale(.98); }
  100% { opacity: 1; transform: none; }
}
@keyframes float-in {
  from { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.25) rotate(0); }
  37% { opacity: 1; }
  to { opacity: .9; transform: rotate(var(--tilt,0deg)); }
}
button {
  font: inherit; font-size: .83rem; font-weight: 650; color: #84204e; background: #fff9;
  border: 1px solid #d67ba9; border-radius: 999px; padding: .63em 1.3em; cursor: pointer;
}
button:focus-visible { outline: 2px solid #9d3166; outline-offset: 4px; }
@media (prefers-reduced-motion: reduce) {
  .stage.playing, .stage.playing * , .stage.playing *::after { animation: none !important; }
  .cursor { display: none; }
}
</style>
</head>
<body>
<main>
  <div class="stage" aria-label="粉色翻盖手机收到一条短信">
    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
      <linearGradient id="pink" x2=".35" y2="1"><stop stop-color="#ffb8de"/><stop offset="1" stop-color="#e94999"/></linearGradient>
      <symbol id="heart" viewBox="0 0 32 32"><path fill="url(#pink)" stroke="#fff7" d="M16 28C11 24 2 18 2 11c0-8 10-10 14-3 4-7 14-5 14 3 0 7-9 13-14 17Z"/><path fill="none" stroke="#fff9" stroke-linecap="round" stroke-width="2" d="M6 11c0-3 2-4 4-4"/></symbol>
    </defs></svg>
    <svg class="phone" viewBox="0 0 1254 1254" role="img" aria-label="带星星挂坠的粉色翻盖手机">
      <defs>
        <image id="y2k-phone-art" href="/img/y2k-phone-startup/phone.png" width="1254" height="1254"/>
        <clipPath id="y2k-phone-body"><path clip-rule="evenodd" d="M0 0H1254V1254H0Z M240 1006H341L371 936 386 827 426 719 458 657 466 628 439 618 412 647 240 860Z"/></clipPath>
        <clipPath id="y2k-phone-charm"><path d="M240 1006H341L371 936 386 827 426 719 458 657 466 628 439 618 412 647 240 860Z"/></clipPath>
        <clipPath id="y2k-phone-screen"><path d="M609 313L711 318 707 404 606 415Z"/></clipPath>
        <radialGradient id="y2k-phone-signal"><stop stop-color="#fff"/><stop offset=".31" stop-color="#fff5c2"/><stop offset=".62" stop-color="#ffa1e4" stop-opacity=".68"/><stop offset="1" stop-color="#ffa1e4" stop-opacity="0"/></radialGradient>
      </defs>
      <use href="#y2k-phone-art" clip-path="url(#y2k-phone-body)"/>
      <g class="charm"><use href="#y2k-phone-art" clip-path="url(#y2k-phone-charm)"/></g>
      <g clip-path="url(#y2k-phone-screen)"><use class="screen-beat" href="#y2k-phone-art"/></g>
      <circle class="signal" cx="831" cy="28" r="18" fill="url(#y2k-phone-signal)"/>
    </svg>
    <svg class="particle heart" aria-hidden="true" style="--left:21%;--top:16%;--size:6%;--dx:220%;--dy:180%;--tilt:-21deg;--delay:2040ms"><use href="#heart"/></svg>
    <svg class="particle heart" aria-hidden="true" style="--left:77%;--top:12%;--size:8%;--dx:-160%;--dy:135%;--tilt:16deg;--delay:2310ms"><use href="#heart"/></svg>
    <svg class="particle heart" aria-hidden="true" style="--left:69%;--top:56%;--size:6%;--dx:-190%;--dy:95%;--tilt:-13deg;--delay:2450ms"><use href="#heart"/></svg>
    <svg class="particle heart" aria-hidden="true" style="--left:14%;--top:59%;--size:5%;--dx:380%;--dy:20%;--tilt:-24deg;--delay:2350ms"><use href="#heart"/></svg>
    <i class="particle bubble" aria-hidden="true" style="--left:12%;--top:31%;--size:8%;--dx:220%;--dy:140%;--delay:2220ms"></i>
    <i class="particle bubble" aria-hidden="true" style="--left:86%;--top:49%;--size:8%;--dx:-350%;--dy:50%;--delay:2160ms"></i>
    <i class="particle bubble" aria-hidden="true" style="--left:70%;--top:72%;--size:11%;--dx:-160%;--dy:-20%;--delay:2590ms"></i>
    <i class="particle bubble" aria-hidden="true" style="--left:28%;--top:8%;--size:3%;--dx:510%;--dy:510%;--delay:2710ms"></i>
    <i class="particle bubble" aria-hidden="true" style="--left:83%;--top:68%;--size:3%;--dx:-800%;--dy:0%;--delay:2840ms"></i>
    <div class="sms" lang="ja">
      <div class="sms-screen">
        <div class="sms-header">
          <svg viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><rect x="1" y="1" width="14" height="10" rx="1.2"/><path d="m1.5 2 6.5 5 6.5-5"/></svg>
          <span>新着メール</span>
          <time datetime="22:08">22:08</time>
        </div>
        <strong aria-label="好きです"><span class="typing-line" aria-hidden="true"><span class="letter" style="--letter-index:0">好</span><span class="letter" style="--letter-index:1">き</span><span class="letter" style="--letter-index:2">で</span><span class="letter" style="--letter-index:3">す</span><i class="cursor"></i></span></strong>
      </div>
    </div>
    <div class="receive-status" lang="ja" aria-label="受信中">受信中<span aria-hidden="true"><span style="--dot-index:0">.</span><span style="--dot-index:1">.</span><span style="--dot-index:2">.</span></span></div>
  </div>
  <button type="button">↻ 重播动画</button>
</main>
<script>
const stage = document.querySelector('.stage');
const phone = new Image();
phone.src = document.querySelector('#y2k-phone-art').getAttribute('href');
function replay() {
  stage.classList.remove('playing');
  void stage.offsetWidth;
  stage.classList.add('playing');
}
document.querySelector('button').addEventListener('click', replay);
phone.decode().then(replay, replay);
</script>
</body>
</html>
